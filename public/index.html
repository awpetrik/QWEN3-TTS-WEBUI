<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3-TTS Playground</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- SVG Icons -->
    <style>
        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Top Navigation -->
        <header class="top-nav">
            <div class="nav-left">
                <div class="logo">
                    <svg class="icon" height="1em" style="flex:none;line-height:1" viewBox="0 0 24 24" width="1em" xmlns="http://www.w3.org/2000/svg"><title>Qwen</title><path d="M12.604 1.34c.393.69.784 1.382 1.174 2.075a.18.18 0 00.157.091h5.552c.174 0 .322.11.446.327l1.454 2.57c.19.337.24.478.024.837-.26.43-.513.864-.76 1.3l-.367.658c-.106.196-.223.28-.04.512l2.652 4.637c.172.301.111.494-.043.77-.437.785-.882 1.564-1.335 2.34-.159.272-.352.375-.68.37-.777-.016-1.552-.01-2.327.016a.099.099 0 00-.081.05 575.097 575.097 0 01-2.705 4.74c-.169.293-.38.363-.725.364-.997.003-2.002.004-3.017.002a.537.537 0 01-.465-.271l-1.335-2.323a.09.09 0 00-.083-.049H4.982c-.285.03-.553-.001-.805-.092l-1.603-2.77a.543.543 0 01-.002-.54l1.207-2.12a.198.198 0 000-.197 550.951 550.951 0 01-1.875-3.272l-.79-1.395c-.16-.31-.173-.496.095-.965.465-.813.927-1.625 1.387-2.436.132-.234.304-.334.584-.335a338.3 338.3 0 012.589-.001.124.124 0 00.107-.063l2.806-4.895a.488.488 0 01.422-.246c.524-.001 1.053 0 1.583-.006L11.704 1c.341-.003.724.032.9.34zm-3.432.403a.06.06 0 00-.052.03L6.254 6.788a.157.157 0 01-.135.078H3.253c-.056 0-.07.025-.041.074l5.81 10.156c.025.042.013.062-.034.063l-2.795.015a.218.218 0 00-.2.116l-1.32 2.31c-.044.078-.021.118.068.118l5.716.008c.046 0 .08.02.104.061l1.403 2.454c.046.081.092.082.139 0l5.006-8.76.783-1.382a.055.055 0 01.096 0l1.424 2.53a.122.122 0 00.107.062l2.763-.02a.04.04 0 00.035-.02.041.041 0 000-.04l-2.9-5.086a.108.108 0 010-.113l.293-.507 1.12-1.977c.024-.041.012-.062-.035-.062H9.2c-.059 0-.073-.026-.043-.077l1.434-2.505a.107.107 0 000-.114L9.225 1.774a.06.06 0 00-.053-.031zm6.29 8.02c.046 0 .058.02.034.06l-.832 1.465-2.613 4.585a.056.056 0 01-.05.029.058.058 0 01-.05-.029L8.498 9.841c-.02-.034-.01-.052.028-.054l.216-.012 6.722-.012z" fill="#ffffff" fill-rule="nonzero"></path></svg>
                    <span>Qwen3-TTS Playground</span>
                    <span id="backend-badge" class="badge hidden"></span>
                </div>
            </div>
            <div class="nav-right">
                <button id="generate-btn" class="run-btn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <span class="btn-text">Run Synthesis</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace">

            <!-- Left Column: Content -->
            <main class="content-pane">
                <div class="content-wrapper">
                    <div class="dynamic-instructions-wrapper" id="instructions-container">
                        <!-- Instuctions -->
                    </div>

                    <div class="form-group text-group">
                        <label for="text-input" class="visually-hidden">Text Input</label>
                        <textarea id="text-input"
                            placeholder="Start typing or paste text here to synthesize..."></textarea>
                    </div>

                    <div class="output-section hidden" id="output-section">
                        <h3 class="section-title">Audio Output</h3>
                        <div id="audio-result" class="audio-card">
                            <p id="status-text" class="status-indicator">Ready...</p>
                            <!-- Audio element -->
                        </div>
                        <div id="history-list" class="history-list"></div>
                    </div>
                </div>
            </main>

            <!-- Right Column: Settings -->
            <aside class="settings-pane">
                <div class="settings-header">
                    <h3>Run Settings</h3>
                </div>

                <div class="settings-section">
                    <div class="settings-block">
                        <h4 class="section-subtitle">Model Settings</h4>
                        <div class="form-group">
                            <div class="select-container">
                                <select id="model-select">
                                    <option value="" disabled selected>Loading models...</option>
                                </select>
                            </div>
                            <p class="helper-text" id="model-helper">Select TTS model architecture.</p>
                        </div>
                    </div>

                    <!-- Dynamic Settings Area -->
                    <div id="dynamic-settings" class="dynamic-settings-zone">
                        <!-- Speaker, Speed, Refs -->
                    </div>
                </div>
            </aside>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
